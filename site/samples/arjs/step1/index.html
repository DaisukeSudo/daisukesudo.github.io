<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/studio-backend@8449d9127e2f5a48ef23fd277d32ae0a77261615/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/studio-backend@8449d9127e2f5a48ef23fd277d32ae0a77261615/src/modules/marker/tools/gesture-handler.js"></script>
    <title>Hello AR.js World! Step1</title>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false;"
      loading-screen="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      embedded
      gesture-detector
    >
      <a-assets>
        <a-asset-item
          id="asset-fox"
          src="./assets/fox.gltf"
        ></a-asset-item>
      </a-assets>

      <a-marker
        type="pattern"
        preset="custom"
        url="./assets/marker.patt"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
      >
        <a-entity
          class="clickable"
          gltf-model="#asset-fox"
          scale="1.6 1.6 1.6"
          gesture-handler
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
