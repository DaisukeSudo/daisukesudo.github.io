<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>
    <link rel="stylesheet" href="./style.css">
    <title>Hello AR.js World! Step3</title>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <div class="centered">
      <div class="info">...</div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false;"
      loading-screen="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      embedded
    >
      <a-assets>
        <a-asset-item
          id="asset-fox"
          src="./assets/fox.gltf"
        ></a-asset-item>
        <a-asset-item
          id="asset-fox-yellow"
          src="./assets/fox-yellow.gltf"
        ></a-asset-item>
        <a-asset-item
          id="asset-fox-blue"
          src="./assets/fox-blue.gltf"
        ></a-asset-item>
        <a-asset-item
          id="asset-fox-red"
          src="./assets/fox-red.gltf"
        ></a-asset-item>
      </a-assets>

      <a-camera
        gps-camera='gpsMinDistance: 10' 
        arjs-look-controls='smoothingFactor: 0.1'
        rotation-reader
      ></a-camera>
    </a-scene>

    <div class="centered command">
      <button class="btn" data-action="change"></button>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
